name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with HTML report
        run: npm run test:report 2>&1 | tee /tmp/test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report/
          retention-days: 30

      - name: Write test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/test-output.txt | tail -1 || echo "—")
          FAILED=$(grep -oP '\d+(?= failed)' /tmp/test-output.txt | tail -1 || echo "0")
          FILES=$(grep -oP '\d+(?= passed \()' /tmp/test-output.txt | tail -1 || echo "—")
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Test Files | $FILES |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> HTML report is available as a workflow artifact." >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

